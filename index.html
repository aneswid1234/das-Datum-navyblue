<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion German Date Widget</title>
    <style>
        @font-face {
            font-family: 'Spicy Wasabi';
            src: url('SpicyWasabi.ttf') format('truetype');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: transparent; 
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            color: #0d238a; 
            font-family: 'Spicy Wasabi', cursive, sans-serif;
        }

        #widget-container {
            width: 100%;
            text-align: center;
            padding: 0 10px;
        }

        #main-date {
            font-size: clamp(1.6rem, 3.8vw, 2.8rem);
            white-space: nowrap;
            margin-bottom: 10px;
        }

        #date-read {
            font-size: clamp(1.1rem, 2.5vw, 1.9rem);
            white-space: nowrap;
            opacity: 0.85;
            margin-bottom: 6px;
        }

        #time-read {
            font-size: clamp(1rem, 2.2vw, 1.7rem);
            white-space: nowrap;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div id="widget-container">
        <div id="main-date"><span id="date-text">Lade...</span></div>
        <div id="date-read"><span id="date-read-text"></span></div>
        <div id="time-read"><span id="time-read-text"></span></div>
    </div>

    <script>
        const numbersOrdinal = ["", "erste", "zweite", "dritte", "vierte", "fünfte", "sechste", "siebte", "achte", "neunte", "zehnte", "elfte", "zwölfte", "dreizehnte", "vierzehnte", "fünfzehnte", "sechzehnte", "siebzehnte", "achtzehnte", "neunzehnte", "zwanzigste", "einundzwanzigste", "zweiundzwanzigste", "dreiundzwanzigste", "vierundzwanzigste", "fünfundzwanzigste", "sechsundzwanzigste", "siebenundzwanzigste", "achtundzwanzigste", "neunundzwanzigste", "dreißigste", "einunddreißigste"];

        const numbersCard = ["null", "eins", "zwei", "drei", "vier", "fünf", "sechs", "sieben", "acht", "neun", "zehn", "elf", "zwölf", "dreizehn", "vierzehn", "fünfzehn", "sechzehn", "siebzehn", "achtzehn", "neunzehn", "zwanzig", "einundzwanzig", "zweiundzwanzig", "dreiundzwanzig", "vierundzwanzig", "fünfundzwanzig", "sechsundzwanzig", "siebenundzwanzig", "achtundzwanzig", "neunundzwanzig", "dreißig", "einunddreißig", "zweiunddreißig", "dreiunddreißig", "vierunddreißig", "fünfunddreißig", "sechsunddreißig", "siebenunddreißig", "achtunddreißig", "neununddreißig", "vierzig", "einundvierzig", "zweiundvierzig", "dreiundvierzig", "vierundvierzig", "fünfundvierzig", "sechsundvierzig", "siebenundvierzig", "achtundvierzig", "neunundvierzig", "fünfzig", "einundfünfzig", "zweiundfünfzig", "dreiundfünfzig", "vierundfünfzig", "fünfundfünfzig", "sechsundfünfzig", "siebenundfünfzig", "achtundfünfzig", "neunundfünfzig"];

        // Fungsi khusus pengucapan tahun dalam bahasa Jerman (Contoh: 2026 -> zweitausendsechsundzwanzig)
        function getGermanYearRead(year) {
            let thousands = Math.floor(year / 1000);
            let remainder = year % 1000;
            let hundreds = Math.floor(remainder / 100);
            let tensUnits = remainder % 100;

            let result = "";
            if (thousands > 0) {
                result += (thousands === 1 ? "ein" : numbersCard[thousands]) + "tausend";
            }
            if (hundreds > 0) {
                result += numbersCard[hundreds] + "hundert";
            }
            if (tensUnits > 0) {
                let u = tensUnits % 10;
                let t = Math.floor(tensUnits / 10);
                if (u === 0) {
                    result += numbersCard[tensUnits];
                } else if (t === 0) {
                    result += numbersCard[u];
                } else {
                    let unitsWord = (u === 1 ? "ein" : numbersCard[u]);
                    let tensWord = ["", "", "zwanzig", "dreißig", "vierzig", "fünfzig", "sechzig", "siebzig", "achtzig", "neunzig"][t];
                    result += unitsWord + "und" + tensWord;
                }
            }
            return result;
        }

        function getGermanTimeRead(hours, minutes) {
            let formal = `${numbersCard[hours]} Uhr`;
            if (minutes > 0) formal += ` ${numbersCard[minutes]}`;

            let informal = "";
            let h12 = hours % 12;
            let nextH12 = (h12 + 1) % 12;
            if (nextH12 === 0) nextH12 = 12;

            if (minutes === 0) {
                informal = `${numbersCard[hours]} Uhr`;
            } else if (minutes === 15) {
                informal = `Viertel nach ${numbersCard[h12 === 0 ? 12 : h12]}`;
            } else if (minutes === 30) {
                informal = `halb ${numbersCard[nextH12]}`;
            } else if (minutes === 45) {
                informal = `Viertel vor ${numbersCard[nextH12]}`;
            } else if (minutes < 30) {
                informal = `${numbersCard[minutes]} nach ${numbersCard[h12 === 0 ? 12 : h12]}`;
            } else {
                let diff = 60 - minutes;
                informal = `${numbersCard[diff]} vor ${numbersCard[nextH12]}`;
            }
            return { formal, informal };
        }

        function updateWidget() {
            const now = new Date();
            const weekday = now.toLocaleDateString('de-DE', { weekday: 'long' });
            const day = now.getDate();
            const monthName = now.toLocaleDateString('de-DE', { month: 'long' });
            const year = now.getFullYear();
            const hours = now.getHours();
            const minutes = now.getMinutes();

            const timeStr = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
            const mainString = `am ${weekday}, dem ${day}. ${monthName} ${year} um ${timeStr} Uhr`;
            document.getElementById('date-text').innerText = mainString;

            let dayRead = numbersOrdinal[day] || day;
            if (day === 1) dayRead = "ersten";
            else if (day === 3) dayRead = "dritten";
            else if (day === 7) dayRead = "siebten";
            else if (day === 8) dayRead = "achten";
            else if (!dayRead.endsWith('n')) dayRead += 'n';
            
            // Tahun diubah menjadi bentuk ejaan kata-kata bahasa Jerman
            let yearRead = getGermanYearRead(year);
            document.getElementById('date-read-text').innerText = `📅 Datum: dem ${dayRead} ${monthName} ${yearRead}`;

            const timeReads = getGermanTimeRead(hours, minutes);
            document.getElementById('time-read-text').innerText = `⏰ Formal: ${timeReads.formal} | Informal: ${timeReads.informal}`;
        }

        updateWidget();
        setInterval(updateWidget, 1000);
    </script>
</body>
</html>
